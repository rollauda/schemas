ons (\u003cem>peut-&#xea;tre\u003c/em>, \u003cem>il faudrait\u003c/em>...)","children":[],"payload":{"tag":"li","lines":"17,18"}}],"payload":{"tag":"li","lines":"14,18"}}],"payload":{"tag":"li","lines":"11,18"}}],"payload":{"tag":"li","lines":"7,18"}},{"content":"\u003cstrong>Pourquoi&#xa0;?\u003c/strong> Fonction du langage \u003cbr>syntaxique (homo sapiens) ? \u003c!--fold-->","children":[{"content":"\u003cstrong>Hypoth&#xe8;se 1 (fausse)\u003c/strong> : \u003cbr>complexification des outils \u003cbr>donc besoin d&apos;apprentissage. \u003cbr>\u003cstrong>Non\u003c/strong> : montrer suffit (exemple : chimpanz&#xe9;s)","children":[],"payload":{"tag":"li","lines":"19,20"}},{"content":"\u003cstrong>Hypoth&#xe8;se 2 (fausse)\u003c/strong> : \u003cbr>la chasse en groupe, coordonner les strat&#xe9;gies. \u003cbr>\u003cstrong>Non\u003c/strong> : chasser se fait sans parler","children":[],"payload":{"tag":"li","lines":"20,21"}},{"content":"\u003cstrong>Hypoth&#xe8;se 3 (vraie) : \u003cbr>le langage cr&#xe9;e des r&#xe9;cits \u003cbr>qui fondent les soci&#xe9;t&#xe9;s\u003c/strong>","children":[{"content":"\u003cstrong>Mythes fondateurs\u003c/strong> : \u003cbr>raconter les origines, &#xe9;tablir \u003cbr>les grandes r&#xe8;gles sociales \u003cbr> et cr&#xe9;er une coh&#xe9;sion sociale","children":[],"payload":{"tag":"li","lines":"22,23"}},{"content":"\u003cstrong>Humain\u003c/strong> : animal qui se lib&#xe8;re de la nature \u003cbr>gr&#xe2;ce &#xe0; la parole en racontant une histoire \u003cbr>commune  et en rempla&#xe7;ant les lois naturelles \u003cbr>par des r&#xe8;gles sociales, culturelles","children":[],"payload":{"tag":"li","lines":"23,24"}}],"payload":{"tag":"li","lines":"21,24"}}],"payload":{"tag":"li","lines":"18,24"}}],"payload":{"tag":"h1","lines":"6,7"}}, {"direction":"TB","initialExpandLevel":2});</script>
