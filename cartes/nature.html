<script>markmapExtras.demarrer(document.getElementById('mindmap'), {"content":"\u003cstrong>NATURE...\u003c/strong> \u003c!--fold-->","children":[{"content":"\u003cstrong>1. \u003cu>Entit&#xe9; cr&#xe9;atrice\u003c/u>\u003c/strong> &#xe0; l&apos;origine des &#xea;tres naturels vivants \u003cbr> (animaux, plantes...)  et inertes (eau, terre, pierres, etc.) \u003c!--fold-->","children":[{"content":"=&gt; Nature = Ensemble des choses \u003cbr> non fabriqu&#xe9;es par les &#xea;tre humains","children":[],"payload":{"tag":"li","lines":"2,3"}},{"content":"Les &#xea;tres naturels ob&#xe9;issent &#xe0; des \u003cstrong>lois de la nature\u003c/strong> \u003cbr>  - lois de la physique/chimie pour l&apos;inerte, \u003cbr> - lois de l&apos;&#xe9;volution pour les &#xea;tres vivants","children":[],"payload":{"tag":"li","lines":"3,4"}},{"content":"\u003cstrong>\u003cu>Nature &#x2260; Artifice\u003c/u>\u003c/strong> (tout ce qui est cr&#xe9;&#xe9; par l&apos;humain)","children":[],"payload":{"tag":"li","lines":"4,5"}}],"payload":{"tag":"li","lines":"1,5"}},{"content":"\u003cstrong>2. \u003cu>Les caract&#xe9;ristiques naturelles\u003c/u>\u003c/strong> qui guident les actions  \u003cbr> des animaux (conduites instinctives, savoirs inn&#xe9;s) \u003c!--fold-->","children":[{"content":"\u003cu>Exemples\u003c/u> : certains animaux connaissent\u003cbr> de mani&#xe8;re  inn&#xe9;e les plantes comestibles /  \u003cbr> les humains ont un instinct de survie","children":[],"payload":{"tag":"li","lines":"6,7"}},{"content":"Les hommes ob&#xe9;issent &#xe0; des \u003cstrong>lois naturelles\u003c/strong>  \u003cbr> qui justifient leurs comportements  \u003cbr> (\u003cu>Exemple\u003c/u> : la l&#xe9;gitime d&#xe9;fense)","children":[],"payload":{"tag":"li","lines":"7,8"}},{"content":"\u003cstrong>\u003cu>Nature &#x2260; Culture\u003c/u>\u003c/strong> (l&apos;ensemble des caract&#xe9;ristiques \u003cbr> humaines  \u003cstrong>acquises\u003c/strong> au cours de son histoire :  \u003cbr> l&apos;&#xe9;ducation, la morale, la politique, etc.)","children":[],"payload":{"tag":"li","lines":"8,9"}}],"payload":{"tag":"li","lines":"5,9"}},{"content":"\u003cstrong>3. \u003cu>La nature d&apos;une chose\u003c/u>\u003c/strong>, son \u003cstrong>essence\u003c/strong>, ce qui la d&#xe9;finit \u003c!--fold-->","children":[{"content":"L&apos;essence d&apos;une chose est l&apos;ensemble des  \u003cstrong>\u003cu>caract&#xe9;ristiques \u003cbr> intemporelles et universelles\u003c/u>\u003c/strong> qui la d&#xe9;finissent  \u003cbr> et la distinguent des autres choses","children":[],"payload":{"tag":"li","lines":"10,11"}},{"content":"\u003cstrong>Aristote\u003c/strong> : les choses se d&#xe9;finissent par \u003cbr> &quot;\u003cem>genre prochain\u003c/em>&quot; et &quot;\u003cem>diff&#xe9;rence sp&#xe9;cifique\u003c/em>&quot;","children":[],"payload":{"tag":"li","lines":"11,12"}},{"content":"Pour l&apos;homme, on parle de \u003cstrong>&quot;Nature humaine&quot;\u003c/strong>","children":[],"payload":{"tag":"li","lines":"12,13"}},{"content":"\u003cu>Exemple\u003c/u> : &#xab;&#xa0;\u003cem>L&apos;homme est un animal politique\u003c/em>&#xa0;&#xbb; (Aristote)\u003cbr> - animal = le genre prochain \u003cbr> - politique = la diff&#xe9;rence sp&#xe9;cifique \u003cbr> (car absente chez les autres animaux).","children":[],"payload":{"tag":"li","lines":"13,14"}},{"content":"\u003cstrong>\u003cu>Essence (nature) &#x2260; Accident\u003c/u>\u003c/strong> (les caract&#xe9;ristiques accidentelles,\u003cbr> non-essentielles d&apos;une chose, qui ne la d&#xe9;finissent pas). \u003cbr>(\u003cu>Exemple\u003c/u> : l&apos;origine sociale, la couleur de peau, le niveau \u003cbr> d&apos;&#xe9;ducation ne me d&#xe9;finissent pas en tant qu&apos;&#xea;tre humain)","children":[],"payload":{"tag":"li","lines":"14,15"}}],"payload":{"tag":"li","lines":"9,15"}}],"payload":{"tag":"h1","lines":"0,1"}}, {"direction":"TB","initialExpandLevel":2});</script>
