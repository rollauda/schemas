":"h5","lines":"23,24"}},{"content":"\u003cstrong>Exemples\u003c/strong> : choisir alors qu&apos;on aurait pu choisir autrement &#xb7; \u003cbr> contre-exemple : &#xab; tout &#xe9;tait &#xe9;crit &#xbb; \u003c!--fold-->","children":[],"payload":{"tag":"h5","lines":"24,25"}}],"payload":{"tag":"h4","lines":"21,22"}}],"payload":{"tag":"h3","lines":"16,17"}}],"payload":{"tag":"h2","lines":"11,12"}}],"payload":{"tag":"h1","lines":"6,7"}}, {"direction":"TB","initialExpandLevel":2});</script>
